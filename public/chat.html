<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>GproSoft - Asistente de soporte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin: 0; background: #f2f4f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    #app { width: 100%; max-width: 1000px; height: 92vh; background: #fff; border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.12); display: flex; flex-direction: column; overflow: hidden; }
    header { background: #1d3461; color: #fff; padding: 18px 24px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    header .dot { width: 10px; height: 10px; border-radius: 50%; background: #1ab4e8; }
    header h1 { font-size: 16px; margin: 0; font-weight: 600; }
    header p { margin: 2px 0 0; font-size: 12px; opacity: 0.75; }
    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 14px; font-size: 14px; line-height: 1.5; white-space: pre-wrap; }
    .msg.bot { align-self: flex-start; background: #eef1f6; color: #1d1d1f; border-bottom-left-radius: 4px; }
    .msg.user { align-self: flex-end; background: #1ab4e8; color: #fff; border-bottom-right-radius: 4px; }
    .msg.typing { align-self: flex-start; background: #eef1f6; color: #8a8f98; font-style: italic; }
    .msg-img { max-width: 60%; border-radius: 10px; border: 1px solid #eee; align-self: flex-start; cursor: zoom-in; display: block; }
    form { display: flex; padding: 16px 24px; gap: 10px; border-top: 1px solid #eee; flex-shrink: 0; }
    input { flex: 1; border: 1px solid #ddd; border-radius: 24px; padding: 12px 18px; font-size: 14px; outline: none; }
    input:focus { border-color: #1ab4e8; }
    button { background: #1d3461; color: #fff; border: none; border-radius: 24px; padding: 0 24px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: default; }
    #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; padding: 30px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 10px 60px rgba(0,0,0,0.5); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="dot"> </div>div>
        <div>
          <h1>Asistente GproSoft</h1>
        <p>Respuestas al instante sobre el ERP</p>
        </div>
      </header>
    <div id="messages"> </div>
    <form id="chatForm">
    <input id="input" type="text" placeholder="Escribi tu consulta..." autocomplete="off" />
    <button id="sendBtn" type="submit"> Enviar </button>button>
    </form>form>
    </div>
  <div id="lightbox">
  <img id="lightboxImg" src="" />
  </div>
  <script>
    var messagesEl = document.getElementById("messages");
    var form = document.getElementById("chatForm");
    var input = document.getElementById("input");
    var sendBtn = document.getElementById("sendBtn");
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightboxImg");
    lightbox.addEventListener("click", function () {
      lightbox.className = "";
      lightboxImg.src = "";
    });
    function addMessage(text, who) {
      var div = document.createElement("div");
      div.className = "msg " + who;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }
    function addImage(articleId) {
      var img = document.createElement("img");
      img.className = "msg-img";
      img.src = "/final100/" + articleId + ".jpg";
      img.onerror = function () { img.remove(); };
      img.addEventListener("click", function () {
        lightboxImg.src = img.src;
        lightbox.className = "open";
      });
      messagesEl.appendChild(img);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    addMessage("Hola! Soy el asistente de soporte de GproSoft. Pregunta lo que necesites sobre el uso del sistema.", "bot");
    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;
      var typingEl = addMessage("Escribiendo...", "typing");
      fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        typingEl.remove();
        if (data.reply) {
          addMessage(data.reply, "bot");
          if (data.articleIds) {
            data.articleIds.forEach(function (id) { addImage(id); });
          }
        } else {
          addMessage("Hubo un error. Intenta de nuevo en un momento.", "bot");
        }
      })
      .catch(function () {
        typingEl.remove();
        addMessage("No pude conectarme. Intenta de nuevo en un momento.", "bot");
      })
      .finally(function () {
        sendBtn.disabled = false;
        input.focus();
    });
    });
  </script>
  </body>
</html>
