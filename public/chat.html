<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <title>GproSoft - Asistente de soporte</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      background: #0f1015;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    #app {
      width: 100%;
      max-width: 1000px;
      height: 92vh;
      background: #17181f;
      border-radius: 16px;
      box-shadow: 0 10px 50px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid #24252e;
    }
    header {
      background: #1a1c25;
      color: #fff;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      border-bottom: 1px solid #24252e;
    }
    header .avatar {
      width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 14px; color: #fff;
    }
    header .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; display: inline-block; margin-right: 4px; box-shadow: 0 0 0 3px rgba(34,197,94,0.18); }
    header h1 { font-size: 15px; margin: 0; font-weight: 600; }
    header p { margin: 3px 0 0; font-size: 12px; color: #9099ab; display: flex; align-items: center; }

    #messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; background: #17181f; }

    .row { display: flex; align-items: flex-start; gap: 8px; max-width: 78%; }
    .row.bot { align-self: flex-start; }
    .row.user { align-self: flex-end; flex-direction: row-reverse; }

    .avatar-sm {
      width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 11px; color: #fff;
    }

    .msg { padding: 12px 16px; border-radius: 16px; font-size: 14.5px; line-height: 1.55; }
    .msg.bot { background: #23242e; color: #e7e9f0; border-bottom-left-radius: 4px; }
    .msg.user { background: #2f6fed; color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; }

    .msg.bot p { margin: 0 0 10px; }
    .msg.bot p:last-child { margin-bottom: 0; }
    .msg.bot h3, .msg.bot h4 { color: #fff; margin: 4px 0 8px; font-size: 15.5px; }
    .msg.bot ol, .msg.bot ul { margin: 0 0 10px; padding-left: 20px; }
    .msg.bot li { margin-bottom: 5px; }
    .msg.bot li:last-child { margin-bottom: 0; }
    .msg.bot strong { color: #ffffff; font-weight: 700; }

    /* typing indicator */
    .msg.typing { background: #23242e; padding: 14px 18px; display: flex; align-items: center; gap: 5px; }
    .msg.typing .tdot {
      width: 7px; height: 7px; border-radius: 50%; background: #7b8296;
      animation: tbounce 1.2s infinite ease-in-out;
    }
    .msg.typing .tdot:nth-child(2) { animation-delay: 0.15s; }
    .msg.typing .tdot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes tbounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .msg-img { max-width: 60%; border-radius: 10px; border: 1px solid #2b2c36; align-self: flex-start; cursor: zoom-in; display: block; margin-left: 34px; }

    form { display: flex; padding: 16px 24px; gap: 10px; border-top: 1px solid #24252e; flex-shrink: 0; background: #17181f; }
    input {
      flex: 1; border: 1px solid #2b2c36; background: #1f2029; color: #e7e9f0;
      border-radius: 24px; padding: 12px 18px; font-size: 14px; outline: none;
    }
    input::placeholder { color: #6b7284; }
    input:focus { border-color: #3b82f6; }
    button {
      background: #2f6fed; color: #fff; border: none; border-radius: 24px;
      padding: 0 24px; font-size: 14px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: default; }

    #lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.88); z-index: 999; align-items: center; justify-content: center; cursor: zoom-out; padding: 30px; }
    #lightbox.open { display: flex; }
    #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; box-shadow: 0 10px 60px rgba(0,0,0,0.6); }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="avatar">G</div>
        <div>
          <h1>Asistente GproSoft</h1>
        <p><span class="dot"></span>Respuestas al instante sobre el ERP</p>
        </div>
      </header>
    <div id="messages"> </div>
    <form id="chatForm">
    <input id="input" type="text" placeholder="Escribi tu consulta..." autocomplete="off" />
    <button id="sendBtn" type="submit"> Enviar </button>
    </form
    </div>
  <div id="lightbox">
  <img id="lightboxImg" src="" />
  </div>
  <script>
    var messagesEl = document.getElementById("messages");
    var form = document.getElementById("chatForm");
    var input = document.getElementById("input");
    var sendBtn = document.getElementById("sendBtn");
    var lightbox = document.getElementById("lightbox");
    var lightboxImg = document.getElementById("lightboxImg");
    lightbox.addEventListener("click", function () {
      lightbox.className = "";
      lightboxImg.src = "";
    });

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
    function inlineMd(s) {
      return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }
    function renderMarkdown(text) {
      var lines = escapeHtml(text).split("\n");
      var html = "";
      var i = 0;
      while (i < lines.length) {
        var line = lines[i];
        if (/^###\s+/.test(line)) { html += "<h4>" + inlineMd(line.replace(/^###\s+/, "")) + "</h4>"; i++; continue; }
        if (/^##\s+/.test(line)) { html += "<h3>" + inlineMd(line.replace(/^##\s+/, "")) + "</h3>"; i++; continue; }
        if (/^#\s+/.test(line)) { html += "<h3>" + inlineMd(line.replace(/^#\s+/, "")) + "</h3>"; i++; continue; }
        if (/^\d+\.\s+/.test(line)) {
          var oItems = [];
          while (i < lines.length && /^\d+\.\s+/.test(lines[i])) {
            oItems.push("<li>" + inlineMd(lines[i].replace(/^\d+\.\s+/, "")) + "</li>");
            i++;
          }
          html += "<ol>" + oItems.join("") + "</ol>";
          continue;
        }
        if (/^[-*]\s+/.test(line)) {
          var uItems = [];
          while (i < lines.length && /^[-*]\s+/.test(lines[i])) {
            uItems.push("<li>" + inlineMd(lines[i].replace(/^[-*]\s+/, "")) + "</li>");
            i++;
          }
          html += "<ul>" + uItems.join("") + "</ul>";
          continue;
        }
        if (line.trim() === "") { i++; continue; }
        var para = [line];
        i++;
        while (i < lines.length && lines[i].trim() !== "" && !/^(\d+\.|[-*]|#)\s?/.test(lines[i])) {
          para.push(lines[i]);
          i++;
        }
        html += "<p>" + inlineMd(para.join(" ")) + "</p>";
      }
      return html;
    }

    function addMessage(text, who) {
      var row = document.createElement("div");
      row.className = "row " + who;
      if (who === "bot") {
        var av = document.createElement("div");
        av.className = "avatar-sm";
        av.textContent = "G";
        row.appendChild(av);
      }
      var div = document.createElement("div");
      div.className = "msg " + who;
      if (who === "bot") {
        div.innerHTML = renderMarkdown(text);
      } else {
        div.textContent = text;
      }
      row.appendChild(div);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    function addTyping() {
      var row = document.createElement("div");
      row.className = "row bot";
      var av = document.createElement("div");
      av.className = "avatar-sm";
      av.textContent = "G";
      row.appendChild(av);
      var div = document.createElement("div");
      div.className = "msg typing";
      div.innerHTML = '<span class="tdot"></span><span class="tdot"></span><span class="tdot"></span>';
      row.appendChild(div);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return row;
    }

    var IMG_BASE = "https://gprosoft-chatbot-d77jsdm6b-tuequipo-ia1.vercel.app/final100/";
    function addImage(articleId) {
      var img = document.createElement("img");
      img.className = "msg-img";
      img.src = IMG_BASE + articleId + ".jpg";
      img.onerror = function () { img.remove(); };
      img.addEventListener("click", function () {
        lightboxImg.src = img.src;
        lightbox.className = "open";
      });
      messagesEl.appendChild(img);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    addMessage("Hola! Soy el asistente de soporte de GproSoft. Pregunta lo que necesites sobre el uso del sistema.", "bot");

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      var text = input.value.trim();
      if (!text) return;
      addMessage(text, "user");
      input.value = "";
      sendBtn.disabled = true;
      var typingRow = addTyping();
      fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text }),
      })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        typingRow.remove();
        if (data.reply) {
          addMessage(data.reply, "bot");
          if (data.articleIds) {
            data.articleIds.forEach(function (id) { addImage(id); });
          }
        } else {
          addMessage("Hubo un error. Intenta de nuevo en un momento.", "bot");
        }
      })
      .catch(function () {
        typingRow.remove();
        addMessage("No pude conectarme. Intenta de nuevo en un momento.", "bot");
      })
      .finally(function () {
        sendBtn.disabled = false;
        input.focus();
    });
    });
  </script>
  </body>
</html>
